services:
  php:
    build:
      context: ./docker/php
      args:
        UID: 1000
        GID: 1000
    container_name: ecsite12v2-php # ☆修正箇所
    volumes:
      - ./src:/var/www/html
    networks:
      - ecsite12v2_net # ☆修正箇所
    command: php-fpm
  nginx:
    build:
      context: ./docker/nginx
    container_name: ecsite12v2-nginx # ☆修正箇所
    ports:
      - "8080:80"
      - "5173:5173"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - ecsite12v2_net # ☆修正箇所
  mysql:
    image: mysql:8.0
    container_name: ecsite12v2-mysql # ☆修正箇所
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - ecsite12v2_net # ☆修正箇所

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ecsite12v2-phpmyadmin # ☆修正箇所
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql
    networks:
      - ecsite12v2_net # ☆修正箇所

  redis:
    image: redis:latest
    container_name: ecsite12v2-redis # ☆修正箇所
    ports:
      - "6379:6379"
    networks:
      - ecsite12v2_net # ☆修正箇所

volumes:
  mysql_data:

networks:
  ecsite12v2_net: # ☆修正箇所